<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona Michała</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animacja delikatnego ruchomego tła */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 12s infinite ease-in-out;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen relative overflow-x-hidden flex flex-col justify-between">

    <!-- RUCHOME TŁO (ANIMACJA) -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-purple-600/30 rounded-full blur-3xl filter animate-blob"></div>
        <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-blue-600/30 rounded-full blur-3xl filter animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-1/4 left-1/3 w-96 h-96 bg-indigo-600/30 rounded-full blur-3xl filter animate-blob animation-delay-4000"></div>
    </div>

    <!-- TREŚĆ STRONY -->
    <main class="relative z-10 flex-grow flex items-center justify-center p-6 text-center">
        <div class="max-w-2xl bg-slate-800/60 backdrop-blur-md p-10 rounded-2xl border border-slate-700/50 shadow-2xl">
            <h1 class="text-4xl md:text-6xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500 mb-4">
                Cześć, jestem Michał 👋
            </h1>
            <p class="text-lg md:text-xl text-slate-300 mb-8">
                Tworzę nowoczesne strony i aplikacje internetowe z wykorzystaniem sztucznej inteligencji.
            </p>
            <div class="flex justify-center gap-4">
                <a href="#kontakt" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg transition-all transform hover:scale-105 shadow-lg shadow-blue-500/30">
                    Skontaktuj się
                </a>
            </div>
        </div>
    </main>

    <footer class="relative z-10 py-4 text-center text-slate-500 text-sm">
        © 2026 Strona Michała. Wszelkie prawa zastrzeżone.
    </footer>

</body>
</html>
